<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>لوحة البائع</title>
<style>
:root{--p:#0F6B5C;--p2:#0B564A;--gold:#C9A227;--bg:#F7F6F2;--sf:#FFF;--tx:#1C1B18;--tx2:#5F5B54;--mu:#98938A;--ok:#2E7D32;--wn:#B26A00;--er:#C0392B;--bd:#E4E1DA;--r:12px}
*{box-sizing:border-box;margin:0}
body{font-family:'IBM Plex Sans Arabic','Segoe UI',Tahoma,sans-serif;background:var(--bg);color:var(--tx);font-size:15px;padding-bottom:76px}
header{background:var(--p);color:#fff;padding:18px 16px 14px}
header .hello{font-size:12px;opacity:.85}
header h1{font-size:20px;font-weight:700;margin-top:2px}
.pill{display:inline-block;background:rgba(255,255,255,.18);border-radius:999px;padding:3px 12px;font-size:11px;margin-top:8px}
.pending-banner{display:flex;gap:12px;align-items:center;background:#FFF7E6;border:1px solid #F0DFB2;margin:12px 16px;padding:12px 14px;border-radius:var(--r)}
.pending-banner.hidden{display:none}
.pending-banner .num{width:40px;height:40px;border-radius:50%;background:var(--gold);color:#fff;display:grid;place-items:center;font-weight:700;font-size:17px}
.pending-banner .txt{flex:1;font-size:13px}
.pending-banner .txt b{display:block;font-size:14px}
.btn{padding:9px 14px;border-radius:8px;border:none;font:inherit;font-weight:600;cursor:pointer;background:var(--p);color:#fff}
.btn.ghost{background:transparent;color:var(--p);border:1px solid var(--p)}
section{margin:0 16px 18px}
.sec-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.sec-head h2{font-size:16px}
.sec-head a{color:var(--p);font-size:12px;text-decoration:none;font-weight:600}
.hscroll{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.bcard{min-width:250px;background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);padding:13px}
.bcard .time{font-size:11px;color:var(--mu);margin-bottom:5px}
.bcard .name{font-weight:600;font-size:14px}
.bcard .cust{color:var(--tx2);font-size:12px;margin-top:3px}
.bcard .foot{display:flex;justify-content:space-between;align-items:center;margin-top:9px}
.badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:600}
.badge.PENDING{background:#F5E9C8;color:var(--wn)}.badge.CONFIRMED{background:#E2F0E3;color:var(--ok)}
.badge.CANCELLED,.badge.REJECTED{background:#F7E2DF;color:var(--er)}.badge.COMPLETED{background:#E7E5E0;color:var(--tx2)}
.badge.EXPIRED{background:#EEEDE9;color:var(--mu)}
.acts{display:flex;gap:6px}
.acts .btn{padding:5px 11px;font-size:12px}
.empty{background:var(--sf);border:1px dashed var(--bd);border-radius:var(--r);padding:26px;text-align:center;color:var(--tx2);font-size:13px}
.rev{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);padding:14px}
.rev .r1{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px}
.rev .stars{color:var(--gold);letter-spacing:2px}
.rev p{color:var(--tx2);font-size:13px}
nav{position:fixed;bottom:0;right:0;left:0;background:var(--sf);border-top:1px solid var(--bd);display:flex;z-index:20}
nav a{flex:1;text-align:center;padding:9px 4px 11px;color:var(--mu);font-size:10px;text-decoration:none}
nav a .ic{font-size:19px;display:block;margin-bottom:2px}
nav a.active{color:var(--p);font-weight:700}
.toast{position:fixed;bottom:88px;right:50%;transform:translateX(50%);background:var(--tx);color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;z-index:50}
.toast.show{opacity:1}
</style>
</head>
<body>
<header>
  <div class="hello" id="vendor-name">…</div>
  <h1>لوحة البائع</h1>
  <span class="pill" id="vendor-status">—</span>
</header>

<div class="pending-banner hidden" id="pending-banner">
  <div class="num" id="pending-num">0</div>
  <div class="txt"><b>طلبات حجز بانتظار المراجعة</b>راجعها واقبلها لتأكيد مواعيدك</div>
  <button class="btn" onclick="showSection('requests')">مراجعة</button>
</div>

<section id="sec-today">
  <div class="sec-head"><h2>حجوزات اليوم</h2><a href="#" onclick="showSection('requests');return false">عرض الكل</a></div>
  <div id="today-list" class="hscroll"></div>
</section>

<section id="sec-revenue">
  <div class="sec-head"><h2>الأرباح</h2><a href="#" onclick="showSection('wallet');return false">المحفظة</a></div>
  <div class="rev">
    <div class="r1"><span>الرصيد المتاح</span><b id="wallet-balance">—</b></div>
    <div class="r1" style="border:none;margin:0"><span>إجمالي المبيعات</span><b id="total-sales">—</b></div>
  </div>
</section>

<section id="sec-requests" style="display:none">
  <div class="sec-head"><h2>طلبات الحجز</h2><a href="#" onclick="showSection('today');return false">رجوع</a></div>
  <div id="requests-list"></div>
</section>

<section id="sec-wallet" style="display:none">
  <div class="sec-head"><h2>المحفظة</h2><a href="#" onclick="showSection('today');return false">رجوع</a></div>
  <div class="rev"><div class="r1"><span>الرصيد</span><b id="wallet-balance2">—</b></div></div>
  <div id="tx-list" style="margin-top:10px"></div>
  <button class="btn" style="margin-top:12px" onclick="requestPayout()">طلب سحب كامل الرصيد المتاح</button>
</section>

<section id="sec-services" style="display:none">
  <div class="sec-head"><h2>خدماتي</h2><a href="#" onclick="showSection('today');return false">رجوع</a></div>
  <div id="services-list"></div>
</section>

<nav id="bottomnav">
  <a href="#" data-v="today" class="active"><span class="ic">📋</span>حجوزات اليوم</a>
  <a href="#" data-v="requests"><span class="ic">🔔</span>الطلبات</a>
  <a href="#" data-v="wallet"><span class="ic">💰</span>الأرباح</a>
  <a href="#" data-v="services"><span class="ic">🧾</span>خدماتي</a>
</nav>
<div class="toast" id="toast"></div>
<script src="vendor.js"></script>
</body>
</html>

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: marketplace_test
          POSTGRES_USER: mp_user
          POSTGRES_PASSWORD: ci_password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U mp_user"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://mp_user:ci_password@127.0.0.1:5432/marketplace_test?schema=public
      JWT_ACCESS_SECRET: ci_access_secret_change_me_32chars!!
      JWT_REFRESH_SECRET: ci_refresh_secret_change_me_32chars
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_TTL: 7d
      BCRYPT_ROUNDS: 4
      SEED_ADMIN_EMAIL: admin@marketplace.local
      SEED_ADMIN_PASSWORD: Admin@2026
      THROTTLE_TTL: 60000
      THROTTLE_LIMIT: 60

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install
        working-directory: backend
        run: npm ci --no-audit --no-fund
      - name: Prisma migrate
        working-directory: backend
        run: npx prisma migrate deploy
      - name: Seed
        working-directory: backend
        run: npx prisma db seed
      - name: Build
        working-directory: backend
        run: npm run build
      - name: Unit tests
        working-directory: backend
        run: npm test
      - name: E2E tests
        working-directory: backend
        run: npm run test:e2e
